<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>添加和管理题目</title>
  <style>
    :root { color-scheme: light; --ink:#263746; --muted:#697782; --line:#d9e0e5; --panel:#fff; --page:#f3f6f8; --blue:#176b94; --danger:#bd3b3b; --star:#f5ae26; }
    * { box-sizing:border-box; } body { margin:0; background:var(--page); color:var(--ink); font:14px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; }
    header { display:flex; gap:14px; align-items:center; padding:14px max(20px, calc((100vw - 1180px)/2)); background:#fff; border-bottom:1px solid var(--line); } h1 { margin:0 auto 0 0; font-size:19px; } a { color:var(--blue); } main { max-width:1180px; margin:28px auto; padding:0 20px 50px; } .card { margin-bottom:20px; padding:22px; border:1px solid var(--line); border-radius:8px; background:var(--panel); box-shadow:0 2px 8px #17324b0a; } h2 { margin:0 0 17px; font-size:17px; } .hint { margin:-9px 0 16px; color:var(--muted); line-height:1.6; }
    label { display:block; margin-bottom:6px; color:var(--muted); font-size:13px; } input { width:100%; height:38px; padding:7px 10px; border:1px solid var(--line); border-radius:4px; color:var(--ink); font:inherit; } input:focus { border-color:var(--blue); outline:2px solid #176b9422; } .token-row,.entry-grid { display:grid; gap:14px; grid-template-columns:1fr auto; align-items:end; } .entry-grid { grid-template-columns:170px minmax(230px,1fr) auto auto; } button { min-height:38px; padding:0 14px; border:1px solid transparent; border-radius:4px; background:#e8edf0; color:var(--ink); cursor:pointer; font:inherit; font-weight:600; } button:hover { filter:brightness(.97); } button.primary { background:var(--blue); color:#fff; } button.danger { color:var(--danger); background:#fff; border-color:#efc7c7; } button:disabled { opacity:.55; cursor:wait; } .form-message { min-height:20px; margin:12px 0 0; color:var(--muted); } .form-message.error { color:var(--danger); } .form-message.success { color:#21804a; }
    .algorithm-summary { display:flex; min-height:38px; flex-wrap:wrap; align-items:center; gap:5px; padding:5px 9px; border:1px solid var(--line); border-radius:4px; cursor:pointer; } .algorithm-summary:hover { border-color:var(--blue); } .tag { padding:3px 7px; border-radius:99px; background:#e4f1f7; color:#176b94; font-size:12px; } .empty-label { color:var(--muted); }
    .rating-input { display:flex; min-height:38px; align-items:center; gap:2px; } .rating-star { position:relative; width:25px; padding:0; border:0; background:transparent; color:#c9d0d5; font-size:25px; line-height:1; } .rating-star::after { position:absolute; inset:0 auto 0 0; width:var(--fill,0%); overflow:hidden; color:var(--star); content:'★'; } .rating-value { margin-left:7px; color:var(--muted); }
    table { width:100%; border-collapse:collapse; } th,td { padding:12px 9px; border-top:1px solid var(--line); text-align:left; vertical-align:middle; } th { color:var(--muted); font-size:12px; font-weight:600; } td.actions { white-space:nowrap; text-align:right; } .id-link { font-weight:700; text-decoration:none; } .small-tags { display:flex; max-width:330px; flex-wrap:wrap; gap:4px; } .rating-display { color:var(--star); letter-spacing:-2px; white-space:nowrap; } .empty { padding:24px; color:var(--muted); text-align:center; }
    .modal[hidden] { display:none; } .modal { position:fixed; z-index:10; inset:0; display:grid; place-items:center; padding:24px; } .backdrop { position:absolute; inset:0; background:#0a1723a6; } .dialog { position:relative; display:grid; width:min(880px,100%); max-height:calc(100vh - 48px); grid-template-rows:auto auto minmax(250px,1fr) auto; overflow:hidden; border-radius:8px; background:#fff; box-shadow:0 24px 80px #0005; } .dialog-head,.dialog-foot { display:flex; align-items:center; justify-content:space-between; padding:15px 20px; border-bottom:1px solid var(--line); } .dialog-head h2 { margin:0; } .dialog-foot { justify-content:flex-end; gap:9px; border-top:1px solid var(--line); border-bottom:0; } .chosen { min-height:68px; padding:12px 20px; border-bottom:1px solid var(--line); } .chooser { display:grid; min-height:300px; grid-template-columns:190px 1fr; } .categories { overflow:auto; border-right:1px solid var(--line); background:#f8fafb; } .category { display:block; width:100%; border:0; border-left:3px solid transparent; border-radius:0; background:transparent; text-align:left; font-weight:400; } .category.active { border-left-color:var(--blue); background:#e9f3f8; color:var(--blue); font-weight:600; } .options { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); align-content:start; gap:5px; overflow:auto; padding:15px; } .option { display:flex; align-items:center; gap:7px; min-height:35px; padding:5px; border-radius:4px; color:var(--ink); cursor:pointer; } .option:hover { background:#f2f5f7; } .option input { width:16px; height:16px; }
    @media(max-width:720px) { header { padding:12px; } main { margin:16px auto; padding:0 12px; } .card { padding:16px; } .token-row,.entry-grid { grid-template-columns:1fr; } .entry-grid button { width:100%; } table thead { display:none; } table,tbody,tr,td { display:block; } tr { position:relative; padding:8px 0; border-top:1px solid var(--line); } td { border:0; padding:4px 0; } td.actions { position:absolute; top:8px; right:0; } .small-tags { max-width:calc(100% - 130px); } .chooser { grid-template-columns:120px 1fr; } .options { grid-template-columns:1fr; } }
  </style>
</head>
<body>
  <header><h1>题目管理</h1><a href="/problems/">返回题们</a></header>
  <main>
    <section class="card">
      <h2>GitHub Token</h2>
      <p class="hint">Token 仅保存在此浏览器。本页面需要仓库 Contents 的读写权限，新增、修改和删除都会直接提交到 main 分支。</p>
      <div class="token-row"><div><label for="token">GitHub Personal Access Token</label><input id="token" type="password" autocomplete="off" placeholder="github_pat_…"></div><button id="save-token">保存 Token</button></div>
    </section>
    <section class="card">
      <h2 id="editor-title">添加题目</h2>
      <p class="hint">支持 <code>AT_abc126_f</code>、<code>CF1145A</code>、<code>P1154</code> 和 <code>U…</code>。识别后会自动填充题名与链接，题名也可以手动修订。</p>
      <div class="entry-grid"><div><label for="problem-id">题号</label><input id="problem-id" placeholder="例如 CF1145A"></div><div><label for="problem-name">题目名称</label><input id="problem-name" placeholder="输入题号后自动获取"></div><div><label>算法</label><div id="algorithm-summary" class="algorithm-summary" role="button" tabindex="0"><span class="empty-label">选择算法</span></div></div><div><label>靓仔度</label><div id="rating-input" class="rating-input" aria-label="靓仔度"></div></div></div>
      <div class="form-message" id="message"></div><div style="margin-top:12px;display:flex;gap:9px"><button id="lookup">识别题号</button><button id="submit" class="primary">添加题目</button><button id="cancel" hidden>取消编辑</button></div>
    </section>
    <section class="card"><h2>已添加的题目</h2><div id="problem-table"></div></section>
  </main>
  <div id="algorithm-modal" class="modal" hidden><div class="backdrop" data-close></div><section class="dialog" role="dialog" aria-modal="true"><div class="dialog-head"><h2>选择题目算法</h2><button data-close aria-label="关闭">×</button></div><div class="chosen"><label>已选算法</label><div id="chosen-tags"><span class="empty-label">尚未选择</span></div></div><div class="chooser"><nav id="categories" class="categories"></nav><div id="options" class="options"></div></div><div class="dialog-foot"><button id="clear-algorithms">清空</button><button id="apply-algorithms" class="primary">确定</button></div></section></div>
  <script>
  (() => {
    'use strict';
    const REPO = 'https://api.github.com/repos/Startale803/Startale803.github.io';
    const PATH = 'source/data/problems.json';
    const $ = id => document.getElementById(id);
    const state = { data:null, sha:null, selected:new Set(), draft:new Set(), category:'', editing:null, rating:3, atcoder:null };
    const token = $('token'); token.value = localStorage.getItem('problem_github_token') || localStorage.getItem('github_token') || '';
    function message(text, kind='') { const el=$('message'); el.textContent=text; el.className='form-message '+kind; }
    function saveToken() { const value=token.value.trim(); if (!value) return message('请输入 Token。','error'); localStorage.setItem('problem_github_token', value); message('Token 已保存在本浏览器。','success'); }
    $('save-token').onclick=saveToken;
    function esc(value) { const div=document.createElement('div'); div.textContent=value || ''; return div.innerHTML; }
    function tags(ids) { const map=new Map(state.data.categories.flatMap(c=>c.algorithms).map(a=>[a.id,a.name])); return ids.map(id=>`<span class="tag">${esc(map.get(id)||id)}</span>`).join(''); }
    function normalizeRating(value) { return Math.max(.5,Math.min(6,Math.round(Number(value||3)*2)/2)); }
    function ratingText(value) { const full=Math.floor(value), half=value-full===.5; return '★'.repeat(full)+(half?'½':'')+'☆'.repeat(6-full-(half?1:0)); }
    function renderRating() { const root=$('rating-input'); root.innerHTML=''; for(let n=1;n<=6;n++){ const star=document.createElement('button'); star.type='button'; star.className='rating-star'; star.textContent='★'; const fill=Math.max(0,Math.min(1,state.rating-n+1)); star.style.setProperty('--fill',(fill*100)+'%'); star.title=`${n-0.5} 到 ${n} 星`; star.onclick=e=>{ const half=e.offsetX < e.currentTarget.clientWidth/2; state.rating=normalizeRating(n-(half?.5:0)); renderRating(); }; root.appendChild(star); } const value=document.createElement('span'); value.className='rating-value'; value.textContent=state.rating+' / 6'; root.appendChild(value); }
    function renderTable() { const root=$('problem-table'); const problems=state.data.problems; if(!problems.length){ root.innerHTML='<div class="empty">还没有题目。</div>'; return; } root.innerHTML=`<table><thead><tr><th>题号 / 名称</th><th>算法</th><th>靓仔度</th><th></th></tr></thead><tbody>${problems.map((p,i)=>`<tr><td><a class="id-link" href="${esc(p.url)}" target="_blank" rel="noopener">${esc(p.id)}</a><br>${esc(p.name)}</td><td><div class="small-tags">${tags(p.algorithms||[])}</div></td><td class="rating-display" title="${p.rating||'未设置'} / 6">${ratingText(normalizeRating(p.rating || stableRating(p.id)))}</td><td class="actions"><button data-edit="${i}">编辑</button> <button class="danger" data-delete="${i}">删除</button></td></tr>`).join('')}</tbody></table>`; root.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>edit(Number(b.dataset.edit))); root.querySelectorAll('[data-delete]').forEach(b=>b.onclick=()=>remove(Number(b.dataset.delete))); }
    function stableRating(id) { let hash=0; for(const char of id) hash=((hash*31)+char.charCodeAt(0))>>>0; return ((hash%12)+1)/2; }
    async function load() { message('正在加载题目数据…'); try { const res=await fetch(`${REPO}/contents/${PATH}`,{headers:{Accept:'application/vnd.github+json'}}); if(!res.ok) throw new Error('无法加载题目数据 ('+res.status+')'); const file=await res.json(); state.sha=file.sha; state.data=JSON.parse(decodeURIComponent(escape(atob(file.content.replace(/\n/g,''))))); renderTable(); renderCategories(); message(''); } catch(err) { message(err.message,'error'); } }
    function selectedSummary() { const root=$('algorithm-summary'); root.innerHTML=state.selected.size ? tags([...state.selected]) : '<span class="empty-label">选择算法</span>'; }
    function renderCategories() { if(!state.data) return; if(!state.category) state.category=state.data.categories[0].id; $('categories').innerHTML=state.data.categories.map(c=>`<button class="category ${c.id===state.category?'active':''}" data-category="${c.id}">${esc(c.name)}</button>`).join(''); $('categories').querySelectorAll('[data-category]').forEach(b=>b.onclick=()=>{ state.category=b.dataset.category; renderCategories(); renderOptions(); }); renderOptions(); }
    function renderOptions() { const category=state.data.categories.find(c=>c.id===state.category); $('options').innerHTML=category.algorithms.map(a=>`<label class="option"><input type="checkbox" value="${a.id}" ${state.draft.has(a.id)?'checked':''}>${esc(a.name)}</label>`).join(''); $('options').querySelectorAll('input').forEach(i=>i.onchange=()=>{ i.checked?state.draft.add(i.value):state.draft.delete(i.value); renderChosen(); }); }
    function renderChosen() { $('chosen-tags').innerHTML=state.draft.size?tags([...state.draft]):'<span class="empty-label">尚未选择</span>'; }
    function openAlgorithms() { state.draft=new Set(state.selected); renderCategories(); renderChosen(); $('algorithm-modal').hidden=false; } function closeAlgorithms(){ $('algorithm-modal').hidden=true; }
    $('algorithm-summary').onclick=openAlgorithms; $('algorithm-summary').onkeydown=e=>{if(e.key==='Enter'||e.key===' ') openAlgorithms();}; document.querySelectorAll('[data-close]').forEach(b=>b.onclick=closeAlgorithms); $('clear-algorithms').onclick=()=>{state.draft.clear();renderOptions();renderChosen();}; $('apply-algorithms').onclick=()=>{state.selected=new Set(state.draft);selectedSummary();closeAlgorithms();};
    function canonical(raw) { const input=raw.trim().replace(/\s+/g,''); let m=input.match(/^AT_((?:abc|arc|agc|ahc|typical90|dp|joi)\d+_[a-z0-9_]+)$/i); if(m) return {kind:'at',id:'AT_'+m[1].toLowerCase(),task:m[1].toLowerCase(),url:'https://atcoder.jp/contests/'+m[1].split('_')[0].toLowerCase()+'/tasks/'+m[1].toLowerCase()}; m=input.match(/^CF(\d+)([A-Z][A-Z0-9]*)$/i); if(m) return {kind:'cf',id:'CF'+m[1]+m[2].toUpperCase(),contest:m[1],index:m[2].toUpperCase(),url:'https://codeforces.com/problemset/problem/'+m[1]+'/'+m[2].toUpperCase()}; m=input.match(/^([PU]\d+)$/i); if(m) return {kind:'luogu',id:m[1].toUpperCase(),url:'https://www.luogu.com.cn/problem/'+m[1].toUpperCase()}; return null; }
    async function fetchAtCoderProblems() { const response=await fetch('/data/atcoder-problems.json'); if(!response.ok) throw new Error('HTTP '+response.status); return response.json(); }
    function titleFromHtml(html) { const title=html.match(/<title>([^<]+)<\/title>/i); return title ? title[1].replace(/^.*?\s[-—]\s*/,'').replace(/\s[-—].*$/,'').trim() : ''; }
    async function fetchLuoguTitle(url) { const legacy=state.data.problems.find(problem=>problem.url===url); if(legacy) return legacy.name; const reader='https://r.jina.ai/http://'+url.replace(/^https?:\/\//,''); const response=await fetch(reader); if(!response.ok) throw new Error('HTTP '+response.status); const text=await response.text(); const matched=text.match(/^Title:\s*(.+)$/mi)||text.match(/^#\s+(.+)$/m); if(!matched) throw new Error('题名解析失败'); return matched[1].replace(/^.*?\s[-—]\s*/,'').trim(); }
    async function lookup() { const parsed=canonical($('problem-id').value); if(!parsed) return message('题号格式不正确。示例：AT_abc126_f、CF1145A、P1154。','error'); $('problem-id').value=parsed.id; message('正在获取题目名称…'); try { let name=''; if(parsed.kind==='cf'){ const res=await fetch('https://codeforces.com/api/problemset.problems'); const json=await res.json(); const p=json.result.problems.find(x=>String(x.contestId)===parsed.contest && x.index===parsed.index); if(!p) throw new Error('未找到该 Codeforces 题目'); name=p.name; } else if(parsed.kind==='at') { if(!state.atcoder) state.atcoder=await fetchAtCoderProblems(); const p=state.atcoder.find(x=>x.id.toLowerCase()===parsed.task); if(!p) throw new Error('未找到该 AtCoder 题目'); name=p.title; parsed.url='https://atcoder.jp/contests/'+p.contest_id+'/tasks/'+p.id; } else { name=await fetchLuoguTitle(parsed.url); } $('problem-name').value=name; $('problem-id').dataset.url=parsed.url; message('已识别：'+name,'success'); } catch(err) { $('problem-id').dataset.url=parsed.url; message('链接已生成；题名获取失败，请手动填写。'+err.message,'error'); } }
    $('lookup').onclick=lookup; $('problem-id').addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();lookup();}});
    function reset() { state.editing=null; state.selected.clear(); state.rating=3; $('problem-id').value=''; $('problem-id').dataset.url=''; $('problem-name').value=''; $('editor-title').textContent='添加题目'; $('submit').textContent='添加题目'; $('cancel').hidden=true; selectedSummary(); renderRating(); }
    function edit(index) { const p=state.data.problems[index]; state.editing=index; $('problem-id').value=p.id; $('problem-id').dataset.url=p.url; $('problem-name').value=p.name; state.selected=new Set(p.algorithms||[]); state.rating=normalizeRating(p.rating||stableRating(p.id)); $('editor-title').textContent='编辑题目'; $('submit').textContent='保存修改'; $('cancel').hidden=false; selectedSummary(); renderRating(); window.scrollTo({top:0,behavior:'smooth'}); }
    $('cancel').onclick=()=>{reset();message('已取消编辑。');};
    async function submit() { const parsed=canonical($('problem-id').value); const name=$('problem-name').value.trim(); if(!parsed) return message('请填写正确的题号。','error'); if(!name) return message('请填写题目名称。','error'); if(!state.selected.size) return message('请至少选择一个算法。','error'); const duplicate=state.data.problems.findIndex((p,i)=>p.id===parsed.id && i!==state.editing); if(duplicate>=0) return message('该题号已存在，请直接编辑它。','error'); const item={id:parsed.id,name,url:parsed.url,algorithms:[...state.selected],rating:state.rating}; if(state.editing===null) state.data.problems.push(item); else state.data.problems[state.editing]=item; await persist(state.editing===null?'添加题目: ':'更新题目: ',parsed.id); }
    async function remove(index) { const p=state.data.problems[index]; if(!confirm('确定删除 '+p.id+' 吗？')) return; state.data.problems.splice(index,1); await persist('删除题目: ',p.id); }
    async function persist(prefix,id) { const auth=token.value.trim(); if(!auth) return message('保存需要 GitHub Token，请先输入并保存。','error'); const button=$('submit'); button.disabled=true; message('正在保存到 GitHub…'); try { const latest=await fetch(`${REPO}/contents/${PATH}`,{headers:{Authorization:'Bearer '+auth,Accept:'application/vnd.github+json'}}); if(!latest.ok) throw new Error('无法读取远程文件 ('+latest.status+')'); const remote=await latest.json(); const content=btoa(String.fromCharCode(...new TextEncoder().encode(JSON.stringify(state.data,null,2)+'\n'))); const put=await fetch(`${REPO}/contents/${PATH}`,{method:'PUT',headers:{Authorization:'Bearer '+auth,Accept:'application/vnd.github+json','Content-Type':'application/json'},body:JSON.stringify({message:prefix+id,content,sha:remote.sha,branch:'main'})}); if(!put.ok){const detail=await put.json().catch(()=>({}));throw new Error(detail.message||'保存失败 ('+put.status+')');} state.sha=(await put.json()).content.sha; renderTable(); reset(); message('已保存到 GitHub，网站部署后即可看到更新。','success'); } catch(err) { message(err.message,'error'); renderTable(); } finally { button.disabled=false; } }
    $('submit').onclick=submit; renderRating(); load();
  })();
  </script>
</body>
</html>
